version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
    volumes:
      # Mount for local development so you don't have to rebuild on every change
      - .:/app
    depends_on:
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      # You can override this to point to Qdrant Cloud when testing production locally
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      # This tells Streamlit where to find the Inngest API (default is local dev server)
      - INNGEST_API_BASE=${INNGEST_API_BASE:-http://inngest:8288/v1}
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  inngest:
    image: inngest/inngest:latest
    ports:
      - "8288:8288"
    environment:
      # Tell the local Inngest server where to find your FastAPI backend
      - INNGEST_APP_URL=http://backend:8000/api/inngest
    depends_on:
      - backend

volumes:
  qdrant_storage:
  uploads_data:
